min_version = "2026.8.14"

[tools]
go = "1.26.7"
"go:gotest.tools/gotestsum" = "1.13.0"
"go:github.com/goreleaser/goreleaser/v2" = "2.17.1"

[settings]
activate_aggressive = true
task.run_auto_install = false

[tasks."test:unit"]
description = "Run Go package unit tests"
run = "gotestsum -- ./cmd/... ./internal/..."

[tasks."test:architecture"]
description = "Verify internal module dependency direction"
run = "gotestsum -- ./tests/architecture/..."

[tasks."test:integration"]
description = "Run cross-module tests without external processes"
run = "gotestsum -- ./tests/integration/..."

[tasks."test:distribution"]
description = "Build and verify CLI snapshot archives"
run = "gotestsum -- -tags=distribution ./tests/distribution/..."

[tasks."test:e2e"]
description = "Run the distributed CLI through Git and Docker"
run = "gotestsum -- -tags=e2e ./tests/e2e/..."

[tasks.verify]
description = "Verify repository layout and toolchain policy"
run = [
  "sh scripts/verify/repository-layout.sh",
  "sh scripts/verify/toolchain-source-policy.sh",
]

[tasks."cli:cross-build"]
description = "Cross-build CLI binaries into an explicit external directory"
run = "go run ./cmd/rm-relay-maintainer cli cross-build"

[tasks."cli:package-snapshot"]
description = "Package CLI snapshots into an explicit external directory"
run = "go run ./cmd/rm-relay-maintainer cli package-snapshot"

[tasks."experience:prepare"]
description = "Prepare an isolated local candidate experience"
run = "go run ./cmd/rm-relay-maintainer experience prepare"

[tasks."experience:enter"]
description = "Enter the prepared candidate experience"
run = "go run ./cmd/rm-relay-maintainer experience enter"

[tasks."experience:clean"]
description = "Remove the candidate experience and restore the image tag"
run = "go run ./cmd/rm-relay-maintainer experience clean"
