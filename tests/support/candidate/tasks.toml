["experience:prepare"]
description = "Prepare an isolated local candidate experience"
dir = "{{ config_root }}"
run = "go run ./tests/support/candidate/cmd prepare"

["experience:enter"]
description = "Enter the prepared candidate experience"
dir = "{{ config_root }}"
raw = true
run = "go run ./tests/support/candidate/cmd enter"

["experience:clean"]
description = "Remove the candidate-owned experience files"
dir = "{{ config_root }}"
run = "go run ./tests/support/candidate/cmd clean"
